name: Mobile Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  mobile-check:
    name: Expo mobile production check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run mobile checks
        env:
          EXPO_PUBLIC_API_BASE_URL: https://couriermig.ru
          EXPO_PUBLIC_OAUTH_PORTAL_URL: https://couriermig.ru
          EXPO_PUBLIC_OAUTH_SERVER_URL: https://couriermig.ru
        run: pnpm mobile:check
