name: production-smoke

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  local-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm check

      - name: Local production smoke
        run: pnpm smoke:local

  live-smoke:
    runs-on: ubuntu-latest
    if: ${{ vars.SMOKE_BASE_URL != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Live production smoke
        env:
          SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
        run: pnpm smoke:live
