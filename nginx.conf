# Nginx конфигурация для Courier API
# Размещение: /etc/nginx/sites-available/courier-api
# Активация: sudo ln -s /etc/nginx/sites-available/courier-api /etc/nginx/sites-enabled/

upstream courier_backend {
    # Подключение к Docker контейнеру или локальному серверу
    server 127.0.0.1:3000;
    keepalive 32;
}

# Редирект HTTP на HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.site.ru;

    # Для Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Редирект всего остального на HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS сервер
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.site.ru;

    # SSL сертификаты (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/api.site.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.site.ru/privkey.pem;

    # SSL конфигурация (Mozilla Recommended)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # HSTS (HTTP Strict Transport Security)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Безопасность
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Логирование
    access_log /var/log/nginx/courier-api-access.log combined buffer=32k flush=5s;
    error_log /var/log/nginx/courier-api-error.log warn;

    # Размер буфера для больших запросов
    client_max_body_size 10M;

    # Таймауты
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Основной блок проксирования
    location / {
        proxy_pass http://courier_backend;
        proxy_http_version 1.1;

        # Headers для проксирования
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Port $server_port;

        # Буферизация
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # Кэширование
        proxy_cache_bypass $http_upgrade;
        proxy_no_cache $http_pragma $http_authorization;
    }

    # Health check endpoint (без логирования)
    location /health {
        proxy_pass http://courier_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Metrics endpoint (опционально)
    location /metrics {
        proxy_pass http://courier_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Статические файлы (если есть)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://courier_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        
        # Кэширование статики на 1 год
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Запретить доступ к скрытым файлам
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Запретить доступ к конфиг файлам
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# Редирект с www на non-www (опционально)
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.api.site.ru;

    ssl_certificate /etc/letsencrypt/live/api.site.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.site.ru/privkey.pem;

    return 301 https://api.site.ru$request_uri;
}
