function courierList(){const k=$('previewCourier').value,q=$('courierSearch').value.toLowerCase(),has=db.routes.some(r=>r.courier===k&&r.date===db.day);const rows=db.shipments.filter(s=>!s.archive&&s.status!=='Доставлено'&&(q?s.awb.toLowerCase().includes(q)||s.recipient.toLowerCase().includes(q):has?s.courier===k:!s.courier));$('courierList').innerHTML=`<div class="note">${q?'Поиск по всем отправлениям':has?'Есть лист на сегодня — показаны свои отправления':'Нет листа на сегодня — показаны нераспределённые'}</div>`+table(['Накладная','Получатель','Назначение',''],rows.map(s=>`<tr>${td(esc(s.awb))}${td(esc(s.recipient))}${td(s.courier&&s.courier!==k?`<span class="tag warn">Чужое · ${esc(courier(s.courier).name)}</span>`:s.courier?'Ваше отправление':'Не распределено')}${td(btn('Поставить отметку',`courierMark('${s.id}','${k}')`,'small'))}</tr>`).join(''))}
function courierMark(id,k){const run=()=>{deliveryForm(id);$('modalTitle').textContent='Отметка курьера · '+courier(k).name;const old=window.saveDelivery;window.saveCourierDelivery=()=>{const actual=$('dactual').value,st=$('dstatus').value,d=$('ddate').value;if(st==='Доставлено'&&(!actual.trim()||!d))return error('Укажите дату и получателя');const s=ship(id);s.status=st;s.actual=actual;s.delivered=st==='Доставлено'?d:'';s.events.push({at:date(db.day),text:st+' · '+actual,by:courier(k).name});invalidate(id);closeModal();commit('Отметка курьера сохранена')};$('modalFoot').innerHTML='<span id="err" class="error"></span>'+btn('Отмена','closeModal()')+btn('Сохранить отметку','saveCourierDelivery()','primary')};if(ship(id).courier&&ship(id).courier!==k)confirmBox('Чужое отправление',`Назначено курьеру ${esc(courier(ship(id).courier).name)}. Продолжить постановку отметки?`,run);else run()}
function renderParties(){const type=section==='clients'?'client':'partner',rows=db.parties.filter(p=>p.type===type);return heading(type==='client'?'Клиенты':'Партнёры','Реквизиты, тарифы и взаиморасчёты · основной справочник',btn('＋ Добавить',`partyForm('${type}')`,'primary'))+table(['Название','Контактное лицо','Телефон / email','Город','Отправлений',''],rows.map(p=>`<tr>${td(btn(esc(p.name),`partyForm('${type}','${p.id}')`,'link')+`<div class="sub">ИНН ${esc(p.inn)}</div>`)}${td(esc(p.contact))}${td(esc(p.phone)+`<div class="sub">${esc(p.email)}</div>`)}${td(esc(p.city))}${td(db.shipments.filter(s=>s.owner===p.id).length)}${td(btn('Тарифы',`go('directories');directoryOwner='${p.id}';render()`,'small')+' '+btn('Сверка',`openPartyRecon('${p.id}')`,'small'))}</tr>`).join(''))+`<div class="foot"><span>Все названия и реквизиты в макете — тестовые</span><span>${rows.length} записей</span></div>`}
function partyForm(type,id=''){const p=party(id)||{name:'',contact:'',phone:'',city:'Улан-Удэ',address:'',inn:'',kpp:'',email:''};modal(id?p.name:'Новый '+(type==='client'?'клиент':'партнёр'),`<div class="formgrid">${field('Название *','pname',p.name,'text','span2')}${field('Контактное лицо','pcontact',p.contact)}${field('Телефон','pphone',p.phone)}${field('Email','pemail',p.email,'email')}${field('Город','pcity',p.city)}${field('Адрес','paddress',p.address,'text','span3')}${field('ИНН','pinn',p.inn)}${field('КПП','pkpp',p.kpp)}${field('Расчётный счёт','pbank',p.bank||'')}${field('Банк','pbankname',p.bankname||'')}${field('БИК','pbik',p.bik||'')}${field('Корреспондентский счёт','pcorr',p.corr||'')}</div>${type==='partner'?'<div class="note">Шаблон входящего манифеста настраивается отдельно. Один сохранённый формат для партнёра.</div>':''}`, (id?btn('Тарифы',`closeModal();go('directories');directoryOwner='${id}';render()`):'')+(id&&type==='partner'?btn('Шаблон Excel',`templateForm('${id}')`):'')+btn('Отмена','closeModal()')+btn('Сохранить',`saveParty('${type}','${id}')`,'primary'))}
function saveParty(type,id){if(!$('pname').value.trim())return error('Укажите название');const p={id:id||'pnew'+Date.now(),type};for(const k of ['name','contact','phone','email','city','address','inn','kpp','bank','bankname','bik','corr'])p[k]=$('p'+k).value.trim();if(id)Object.assign(party(id),p);else db.parties.push(p);closeModal();commit('Данные контрагента сохранены')}
function templateForm(id){const p=party(id),t=p.template||{};modal('Шаблон входящего Excel · '+p.name,`<div class="note">Соответствие столбцов сохраняется для партнёра. Сам файл загружается на существующей платформе.</div><div class="formgrid">${[['awb','Номер накладной'],['sender','Отправитель'],['recipient','Получатель'],['city','Населённый пункт'],['weight','Вес']].map(([k,l])=>field(l,'tmpl'+k,t[k]||'')).join('')}</div>`,btn('Отмена','closeModal()')+btn('Сохранить',`saveTemplate('${id}')`,'primary'))}function saveTemplate(id){party(id).template=Object.fromEntries(['awb','sender','recipient','city','weight'].map(k=>[k,$('tmpl'+k).value]));closeModal();commit('Шаблон сохранён')}
let directoryOwner='c1';function renderDirectories(){return heading('Справочники','Тарифы доступны также из карточек клиентов и партнёров',tab==='carriers'?btn('＋ Перевозчик','carrierForm()','primary'):tab==='cities'?btn('＋ Населённый пункт','cityForm()','primary'):tab==='couriers'?btn('＋ Тестовый курьер','courierForm()','primary'):btn('＋ Добавить тариф','tariffForm()','primary'))+`<div class="tabs">${[['tariffs','Тарифы'],['cities','Населённые пункты'],['couriers','Курьеры'],['carriers','Перевозчики']].map(([id,t])=>btn(t,`tab='${id}';render()`,tab===id?'active':'')).join('')}</div>`+(tab==='carriers'?renderCarriers():tab==='cities'?table(['Населённый пункт',''],db.cities.map((c,i)=>`<tr>${td(esc(c))}${td(btn('Изменить',`cityForm(${i})`,'small'))}</tr>`).join('')):tab==='couriers'?table(['Курьер','Телефон','На сегодня',''],db.couriers.map(k=>`<tr>${td(`<span class="dot" style="background:${k.color}"></span>${esc(k.name)}`)}${td(esc(k.phone))}${td(db.shipments.filter(s=>s.courier===k.id&&s.status!=='Доставлено').length)}${td(btn('Изменить',`courierForm('${k.id}')`,'small'))}</tr>`).join('')):`<div class="toolbar"><select aria-label="Контрагент тарифа" onchange="directoryOwner=this.value;render()">${options(db.parties,directoryOwner)}</select><span class="sub">До 1 кг включительно · каждый начатый последующий кг</span></div>`+table(['Направление','Первый кг','Последующий кг',''],db.tariffs.filter(t=>t.owner===directoryOwner).map(t=>`<tr>${td(esc(t.city))}${td(money(t.first))}${td(money(t.next))}${td(btn('Изменить',`tariffForm('${t.id}')`,'small'))}</tr>`).join('')))}
function transportChange(changed){const kind=$('mfTransportType').value;if(changed){const current=$('mfCarrier').value;$('mfCarrier').innerHTML=options(db.carriers.filter(c=>c.type===kind),current,'Выберите перевозчика');$('mfTerminalRequired').checked=kind==='air';$('mfTerminalCost').value=''}const air=kind==='air';$('mfTerminalRequired').disabled=!air;if(!air)$('mfTerminalRequired').checked=false;$('mfTerminalCost').disabled=!air;$('mfTerminalPaid').disabled=!air;}
function renderCarriers(){return table(['Перевозчик / транспортная компания','Тип перевозки','Контакт','Телефон',''],db.carriers.map(c=>`<tr>${td(esc(c.name))}${td(transportLabel(c.type))}${td(esc(c.contact))}${td(esc(c.phone))}${td(btn('Изменить',`carrierForm('${c.id}')`,'small'))}</tr>`).join(''))}
function carrierForm(id='',manifestId=''){const m=db.manifests.find(m=>m.id===manifestId),c=db.carriers.find(c=>c.id===id)||{name:'',type:m?.transportType||'ground',contact:'',phone:''};modal(id?'Перевозчик · '+c.name:'Новый перевозчик',`<div class="formgrid">${field('Название *','trName',c.name,'text','span2')}${selectField('Тип перевозки','trType',options([{id:'air',name:'Авиа'},{id:'ground',name:'Наземный транспорт'}],c.type))}${field('Контакт','trContact',c.contact)}${field('Телефон','trPhone',c.phone)}</div>`,btn('Отмена',manifestId?`manifestView('${manifestId}')`:'closeModal()')+btn('Сохранить',`saveCarrier('${id}','${manifestId}')`,'primary'))}
function saveCarrier(id,manifestId){const name=$('trName').value.trim(),type=$('trType').value;if(!name)return error('Укажите название перевозчика');if(db.carriers.some(c=>c.id!==id&&c.name.toLowerCase()===name.toLowerCase()&&c.type===type))return error('Такой перевозчик уже есть в справочнике');if(id&&db.manifests.some(m=>m.carrierId===id&&m.transportType!==type))return error('Этот перевозчик уже используется. Для другого типа перевозки добавьте отдельную запись.');const c={id:id||'tr'+Date.now(),name,type,contact:$('trContact').value,phone:$('trPhone').value};if(id)Object.assign(db.carriers.find(x=>x.id===id),c);else db.carriers.push(c);db.manifests.filter(m=>m.carrierId===id&&id).forEach(m=>m.carrier=name);if(manifestId){const m=db.manifests.find(m=>m.id===manifestId);if(m.transportType!==type){m.terminalRequired=type==='air';m.terminalCost=null}Object.assign(m,{carrierId:c.id,carrier:c.name,transportType:type});db.shipments.filter(s=>s.manifest===manifestId).forEach(s=>invalidate(s.id));save();render();manifestView(manifestId);toast('Перевозчик добавлен и выбран')}else{closeModal();commit('Перевозчик сохранён')}}
function tariffForm(id='',owner=directoryOwner,city=''){const t=db.tariffs.find(t=>t.id===id)||{owner,city,first:'',next:''};modal('Тариф по направлению',`<div class="formgrid">${selectField('Контрагент','towner',options(db.parties,t.owner))}${selectField('Населённый пункт','tcity',options(db.cities,t.city))}${field('Первый кг, ₽','tfirst',t.first,'number')}${field('Каждый последующий кг, ₽','tnext',t.next,'number')}</div><div class="note">Сформированные документы сохраняют свои суммы.</div>`,btn('Отмена','closeModal()')+btn('Сохранить',`saveTariff('${id}')`,'primary'))}
function saveTariff(id){const first=numeric('tfirst'),next=numeric('tnext');if(first==null||next==null||!checkNumbers([first,next]))return error('Укажите корректные тарифы');const owner=$('towner').value,city=$('tcity').value,existing=db.tariffs.find(t=>t.owner===owner&&t.city===city);if(existing&&existing.id!==id)return error('Тариф для этого направления уже есть — отредактируйте его');if(id)Object.assign(db.tariffs.find(t=>t.id===id),{owner,city,first,next});else db.tariffs.push({id:'t'+Date.now(),owner,city,first,next});db.shipments.filter(s=>s.city===city).forEach(s=>{for(const side of ['income','expense'])if(db.charges[s.id+'|'+owner+'|'+side])db.charges[s.id+'|'+owner+'|'+side].checked=false});closeModal();commit('Тариф сохранён')}
function cityForm(i=-1){modal('Населённый пункт',`<div class="formgrid">${field('Название','cityName',db.cities[i]||'','text','span3')}</div>`,btn('Отмена','closeModal()')+btn('Сохранить',`saveCity(${i})`,'primary'))}function saveCity(i){const name=$('cityName').value.trim();if(!name)return error('Введите название');if(db.cities.some((c,j)=>c===name&&i!==j))return error('Такой пункт уже есть');if(i<0)db.cities.push(name);else{const old=db.cities[i];db.cities[i]=name;db.shipments.filter(s=>s.city===old).forEach(s=>s.city=name);db.tariffs.filter(t=>t.city===old).forEach(t=>t.city=name)}closeModal();commit('Справочник сохранён')}
function courierForm(id=''){const k=courier(id)||{name:'',phone:'',color:'#3293cf'};modal('Тестовый курьер',`<div class="formgrid">${field('ФИО','kname',k.name)}${field('Телефон','kphone',k.phone)}${field('Цвет','kcolor',k.color,'color')}</div>`,btn('Отмена','closeModal()')+btn('Сохранить',`saveCourier('${id}')`,'primary'))}function saveCourier(id){if(!$('kname').value.trim())return error('Введите имя');const k={id:id||'k'+Date.now(),name:$('kname').value,phone:$('kphone').value,color:$('kcolor').value};if(id)Object.assign(courier(id),k);else db.couriers.push(k);closeModal();commit('Тестовый курьер сохранён')}
function openPartyRecon(id){reconOwner=id;reconType=party(id).type;reconSide='income';go('recon')}
function reconRows(){return db.shipments.filter(s=>!s.archive&&(reconSide==='income'?s.owner===reconOwner:s.executor===reconOwner)&&((s.delivered||s.accepted)>=reconFrom&&(s.delivered||s.accepted)<=reconTo)&&(s.status==='Доставлено'||s.status==='Не доставлено'||charge(s,reconOwner,reconSide).include))}
function costs(s){const c=s.executor?charge(s,s.executor,'expense').total:null,m=db.manifests.find(m=>m.id===s.manifest),f=m?freight(m).find(x=>x.id===s.id)?.amount:null;return {total:(c||0)+(f||0)+(terminalShare(s)||0),complete:c!=null&&f!=null&&!terminalIssue(s)}}
function reconBlocked(rows){return rows.some(s=>{const c=charge(s,reconOwner,reconSide);return c.include&&(c.problem||terminalIssue(s)||!c.checked||c.total==null)})}
function renderRecon(){const rows=reconRows(),inc=rows.filter(s=>charge(s,reconOwner,reconSide).include),total=inc.reduce((a,s)=>a+(charge(s,reconOwner,reconSide).total||0),0);return heading(reconType==='client'?'Сверка клиентов':'Сверка партнёров','Проверка стоимости по каждому отправлению',btn('↓ Реестр Excel','exportRecon()')+btn('Сформировать комплект','createDocForm()','primary'))+`<div class="tabs">${btn('Клиенты',"reconType='client';reconOwner=db.parties.find(p=>p.type==='client').id;reconSide='income';render()",reconType==='client'?'active':'')}${btn('Партнёры',"reconType='partner';reconOwner='p1';reconSide='income';render()",reconType==='partner'?'active':'')}</div><div class="toolbar"><select aria-label="Контрагент сверки" onchange="reconOwner=this.value;render()">${options(db.parties.filter(p=>p.type===reconType),reconOwner)}</select><input type="date" aria-label="Начало периода" value="${reconFrom}" onchange="reconFrom=this.value;render()"><span class="muted">—</span><input type="date" aria-label="Конец периода" value="${reconTo}" onchange="reconTo=this.value;render()">${reconType==='partner'?`<select aria-label="Направление расчёта" onchange="reconSide=this.value;render()">${opt('income','Наши услуги партнёру',reconSide)+opt('expense','Услуги партнёра нам',reconSide)}</select>${btn('Взаиморасчёт',`settlementForm('${reconOwner}')`)}`:''}</div>${reconBlocked(rows)?'<div class="note warn">Есть непроверенные или проблемные строки. Перед созданием документов проверьте каждое включённое отправление и внесите терминальную обработку по связанным грузам.</div>':'<div class="note">Проверенные строки готовы к формированию документов.</div>'}`+table(['В расчёт','Накладная / доставка','Получатель / фактически получил','Направление / вес','Базовая стоимость','Доп. начисления','Аэропорт','Итог','Наши расходы','Проверено'],rows.map(s=>{const c=charge(s,reconOwner,reconSide),w=weights(s),co=costs(s);return `<tr>${td(`<input type="checkbox" aria-label="В расчёт ${s.awb}" ${c.include?'checked':''} onchange="setCharge(ship('${s.id}'),reconOwner,reconSide,{include:this.checked,checked:false});commit()">`)}${td(btn(esc(s.awb),`detail('${s.id}')`,'link')+`<div class="sub">${date(s.delivered)}</div>${s.status==='Не доставлено'?statusTag(s.status):''}`)}${td(esc(s.recipient)+`<div class="sub">Получил: ${esc(s.actual||'—')}</div>`,'wrap')}${td(esc(s.city)+`<div class="sub">${w.actual==null?'Вес не указан':num(w.actual)+' кг · расч. '+w.bill+' кг'}</div>`)}${td(c.problem?btn(esc(c.problem),c.problem==='Вес не указан'?`detail('${s.id}')`:`tariffForm('',reconOwner,ship('${s.id}').city)`,'link'):btn(money(c.base),`chargeForm('${s.id}')`,'link')+`<div class="sub">${c.manual!=null?'Изменено вручную':'По тарифу'}</div>`)}${td(btn(money(c.extras.reduce((a,b)=>a+b,0)),`chargeForm('${s.id}')`,'link'))}${td(terminalIssue(s)?'<span class="tag warn">Сумма не указана</span>':money(c.terminal))}${td(money(c.total))}${td(money(co.total)+`<div class="sub">${co.complete?'Все расходы учтены':'Расходы неполные'}</div>`)}${td(`<input type="checkbox" aria-label="Проверено ${s.awb}" ${c.checked?'checked':''} ${c.problem?'disabled':''} onchange="setCharge(ship('${s.id}'),reconOwner,reconSide,{checked:this.checked});commit()">`+(!c.checked?'<div class="sub">Проверить</div>':''))}</tr>`}).join(''))+`<div class="summary"><span>Включено <b>${inc.length}</b></span><span>Проверено <b>${inc.filter(s=>charge(s,reconOwner,reconSide).checked).length}</b></span><span class="right">Итого <b>${money(total)}</b></span></div>`}
function chargeForm(id){const s=ship(id),c=charge(s,reconOwner,reconSide),co=costs(s);modal('Стоимость · '+s.awb,`<p>${esc(pn(reconOwner))} · ${reconSide==='income'?'Выставляем контрагенту':'Расходы на услуги партнёра'}</p><div class="note">По тарифу: ${money(c.auto)}. Наши расходы: ${money(co.total)}${co.complete?'':' · расходы неполные'}.</div><div class="formgrid">${field('Базовая цена вручную, ₽','cbase',c.manual??'','number','span3')}${['Тяжеловес','Доптариф','Сверхсрочно'].map((name,i)=>field(name+', ₽','ce'+i,c.extras[i],'number')+field('Пояснение','cn'+i,c.notes[i],'text','span2')).join('')}</div><div class="note">Пустая базовая цена — использовать тариф. Начисления в клиентской и партнёрской сверках независимы.</div>`,btn('Отмена','closeModal()')+btn('Сохранить',`saveCharge('${id}')`,'primary'))}
function saveCharge(id){const manual=numeric('cbase'),extras=[0,1,2].map(i=>numeric('ce'+i)||0),notes=[0,1,2].map(i=>$('cn'+i).value);if(!checkNumbers([manual,...extras]))return error('Суммы должны быть неотрицательными');if(extras.some((v,i)=>v>0&&!notes[i].trim()))return error('Добавьте пояснение к каждому начислению');setCharge(ship(id),reconOwner,reconSide,{manual,extras,notes,checked:false});closeModal();commit('Стоимость сохранена. Строку нужно проверить заново.')}
function snapshotRows(rows,owner,side){return rows.map(s=>{const c=charge(s,owner,side),w=weights(s);return {id:s.id,awb:s.awb,city:s.city,recipient:s.recipient,actual:s.actual,date:s.delivered,weight:w.actual,bill:w.bill,base:c.base,terminal:c.terminal,extras:clone(c.extras),notes:clone(c.notes),total:c.total}})}

function finishDoc(editId){if(!$('docDate').value)return error('Укажите дату');let old=db.docs.find(d=>d.id===editId),rows=reconRows().filter(s=>charge(s,reconOwner,reconSide).include),year=$('docDate').value.slice(0,4);if(reconBlocked(rows))return error('Есть непроверенные строки');const no=old?.no??(Math.max(0,...db.docs.filter(d=>d.date.startsWith(year)).map(d=>d.no))+1);if(db.docs.some(d=>d.id!==editId&&d.no===no&&d.date.startsWith(year)))return error('В выбранном году этот номер уже занят');const data={id:editId||'d'+Date.now(),no,date:$('docDate').value,owner:reconOwner,party:clone(party(reconOwner)),from:reconFrom,to:reconTo,rows:snapshotRows(rows,reconOwner,reconSide),service:$('docService').value,paid:old?.paid||false};data.total=data.rows.reduce((a,r)=>a+r.total,0);if(old)Object.assign(old,data);else db.docs.push(data);closeModal();save();go('documents');showDoc(data.id,'invoice')}

function togglePaid(id){const d=db.docs.find(d=>d.id===id);confirmBox(d.paid?'Снять отметку оплаты?':'Подтвердить полную оплату?',`Комплект №${d.no} · ${money(d.total)} · ${esc(d.party.name)}`,()=>{d.paid=!d.paid;d.rows.forEach(r=>{const s=ship(r.id);if(s)s.archive=d.paid});commit(d.paid?'Счёт погашен, отправления в архиве':'Отметка снята, отправления возвращены')})}
function settlementData(partner){const docs=db.docs.filter(d=>d.owner===partner&&!d.paid&&d.from===reconFrom&&d.to===reconTo);const billedIds=new Set(docs.flatMap(d=>d.rows.map(r=>r.id)));const eligible=db.shipments.filter(s=>!s.archive&&(s.delivered||s.accepted)>=reconFrom&&(s.delivered||s.accepted)<=reconTo);const ourRows=eligible.filter(s=>s.owner===partner&&!billedIds.has(s.id)&&charge(s,partner,'income').include),theirRows=eligible.filter(s=>s.executor===partner&&charge(s,partner,'expense').include);const income=docs.reduce((a,d)=>a+d.total,0)+ourRows.reduce((a,s)=>a+(charge(s,partner,'income').total||0),0),expense=theirRows.reduce((a,s)=>a+(charge(s,partner,'expense').total||0),0);let transport=0,missing=false;db.manifests.filter(m=>m.created>=reconFrom&&m.created<=reconTo).forEach(m=>{const rows=db.shipments.filter(s=>s.manifest===m.id);if(m.paidBy!==partner&&m.terminalPaidBy!==partner&&!rows.some(s=>s.owner===partner))return;if(m.terminalRequired&&m.terminalCost==null)missing=true;const f=freight(m);if(!f.length){missing=true;return}for(const x of f){const debtor=party(x.owner)?.type==='client'?'us':x.owner;if(debtor===partner&&m.paidBy!==partner)transport+=x.amount;if(m.paidBy===partner&&debtor!==partner)transport-=x.amount}});db.manifests.filter(m=>m.created>=reconFrom&&m.created<=reconTo&&m.terminalRequired).forEach(m=>{for(const x of terminal(m)){const debtor=party(x.owner)?.type==='client'?'us':x.owner;if(debtor===partner&&m.terminalPaidBy!==partner){const inRows=ourRows.some(s=>s.id===x.id)||docs.some(d=>d.rows.some(r=>r.id===x.id&&(r.terminal||0)>0));if(!inRows)transport+=x.amount}if(m.terminalPaidBy===partner&&debtor!==partner)transport-=x.amount}});const blocked=[...ourRows.map(s=>charge(s,partner,'income')),...theirRows.map(s=>charge(s,partner,'expense'))].some(c=>!c.checked||c.problem)||missing;return {docs,income,expense,transport,balance:income-expense+transport,blocked,missing,ids:[...new Set([...ourRows,...theirRows].map(s=>s.id))]}}
function settlementForm(partner){const d=settlementData(partner),already=db.settlements.some(s=>s.partner===partner&&s.from===reconFrom&&s.to===reconTo);modal('Взаиморасчёт · '+pn(partner),`<p>${date(reconFrom)} — ${date(reconTo)} · предыдущие периоды сюда не переносятся</p>`+table(['Основание','Сумма'],`<tr>${td('Наши услуги партнёру')}${td(money(d.income))}</tr><tr>${td('Услуги партнёра нам')}${td(money(d.expense))}</tr><tr>${td('Сальдо перевозки и терминальной обработки')}${td(money(d.transport))}</tr>`)+`<div class="summary"><span>${Math.abs(d.balance)<.005?'Никто не доплачивает':d.balance>0?'Партнёр должен нам':'Мы должны партнёру'}</span><b>${money(Math.abs(d.balance))}</b></div><div class="note ${d.blocked?'warn':''}">${already?'Этот взаиморасчёт уже подтверждён.':d.blocked?'До подтверждения проверьте строки в обеих сверках и заполните стоимость перевозки и терминальной обработки.':'Все строки проверены. Подтверждение погасит включённые счета.'}</div>${d.balance?'<label><input type="checkbox" id="settlementPaid"> Оставшаяся разница полностью оплачена</label>':''}`,btn('Закрыть','closeModal()')+`<button class="primary" ${d.blocked||already?'disabled':''} onclick="confirmSettlement('${partner}')">Подтвердить взаимозачёт</button>`)}
function confirmSettlement(partner){const d=settlementData(partner);if(d.blocked)return error('Остались непроверенные строки');if(d.balance&& !$('settlementPaid').checked)return error('Сначала подтвердите оплату оставшейся разницы');db.settlements.push({id:'st'+Date.now(),partner,from:reconFrom,to:reconTo,...d,docs:d.docs.map(x=>x.id)});d.docs.forEach(doc=>{doc.paid=true;doc.rows.forEach(r=>{if(ship(r.id))ship(r.id).archive=true})});d.ids.forEach(id=>ship(id).archive=true);closeModal();commit('Взаимозачёт подтверждён')}

   const devices=await navigator.mediaDevices.enumerateDevices();if(!caCurrent(s))return;
   s.device=stream.getVideoTracks()[0].getSettings().deviceId||s.device;caStore();$('caDevice').innerHTML=devices.filter(d=>d.kind==='videoinput').map((d,i)=>opt(d.deviceId,d.label||'Камера '+(i+1),s.device)).join('');
 }catch(e){if(caCurrent(s)){caStopStream();$('caCapture').disabled=true;caMessage(e.name==='NotAllowedError'?'Разрешите доступ к камере в настройках браузера':e.name==='NotFoundError'||e.name==='OverconstrainedError'?'Камера не найдена. Подключите USB-камеру и выберите другую.':e.name==='NotReadableError'?'Камера занята другой программой':e.message||'Не удалось включить камеру');$('caDevice').innerHTML='<option value="">Камера по умолчанию</option>';s.device='';caStore()}}
 finally{if(caCurrent(s))$('caStart').disabled=false}
}
function caSetFrame(source,w,h){const s=ca;if(!s||s.busy||w<1||h<1)return;caInvalidate();if(s.frame)s.frame.width=0;
 const factor=Math.min(1,2560/Math.max(w,h));w=Math.round(w*factor);h=Math.round(h*factor);const c=document.createElement('canvas'),rot=s.rotation;c.width=rot%180?h:w;c.height=rot%180?w:h;const x=c.getContext('2d');x.translate(c.width/2,c.height/2);x.rotate(rot*Math.PI/180);x.drawImage(source,-w/2,-h/2,w,h);s.frame=c;$('caCanvas').hidden=false;caPaint();$('caRecognize').disabled=false;caMessage('Кадр готов. Проверьте области накладной и дисплея.');}
function caCapture(){if(!ca||ca.busy)return;const v=$('caVideo');if(!v?.videoWidth)return caMessage('Камера ещё не готова');caSetFrame(v,v.videoWidth,v.videoHeight);caStopStream();$('caCapture').disabled=true}
async function caFile(input){const s=ca,file=input.files?.[0];input.value='';if(!s||s.busy||!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>15*1024*1024)return caMessage('Выберите JPEG, PNG или WebP до 15 МБ');caStopStream();$('caCapture').disabled=true;let bitmap;
 try{bitmap=await createImageBitmap(file);if(caCurrent(s))caSetFrame(bitmap,bitmap.width,bitmap.height)}catch{if(caCurrent(s))caMessage('Не удалось открыть изображение')}finally{bitmap?.close()}}
function caPaint(){if(!ca?.frame)return;const c=$('caCanvas'),f=ca.frame;c.width=f.width;c.height=f.height;const x=c.getContext('2d');x.drawImage(f,0,0);for(const k of ['waybill','scale'])if(k==='waybill'?ca.useWaybill:ca.useScale){const [a,b,w,h]=ca.boxes[k];x.strokeStyle=k==='waybill'?'#2872db':'#119983';x.lineWidth=Math.max(2,c.width/400);x.strokeRect(a*c.width,b*c.height,w*c.width,h*c.height);x.font=Math.max(14,c.width/70)+'px sans-serif';x.fillStyle=x.strokeStyle;x.fillText(k==='waybill'?'Накладная':'Весы',a*c.width+5,Math.max(20,b*c.height+24))}}
function caPoint(e){const r=$('caCanvas').getBoundingClientRect();return [Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))]}
function caPointer(e){if(!ca?.frame||ca.busy)return;e.preventDefault();const p=caPoint(e);if(e.type==='pointerdown'){ca.drag=p;$('caCanvas').setPointerCapture(e.pointerId);return}if(!ca.drag)return;const a=ca.drag;const box=[Math.min(a[0],p[0]),Math.min(a[1],p[1]),Math.abs(p[0]-a[0]),Math.abs(p[1]-a[1])];if(box[2]>.01&&box[3]>.01){ca.boxes[ca.mode]=box;caInvalidate();caPaint()}if(e.type==='pointerup'){ca.drag=null;caStore()}}
function caCrop(s,k){const [a,b,w,h]=s.boxes[k],f=s.frame,c=document.createElement('canvas');c.width=Math.round(w*f.width);c.height=Math.round(h*f.height);if(c.width<30||c.height<20)throw new Error('Область слишком маленькая');c.getContext('2d').drawImage(f,a*f.width,b*f.height,w*f.width,h*f.height,0,0,c.width,c.height);const data=c.toDataURL('image/jpeg',.92);c.width=c.height=0;if(data.length>4*1024*1024)throw new Error('Область слишком велика. Уменьшите её');return data}
function caBusy(value){if(!ca)return;ca.busy=value;document.querySelectorAll('#modalBody button,#modalBody select,#modalBody input').forEach(el=>el.disabled=value);if(!value){$('caCapture').disabled=!ca.stream;$('caRecognize').disabled=!ca.frame}}
async function caRecognize(){const s=ca;if(!s||s.busy||!s.frame)return;if(!s.useWaybill&&!s.useScale)return caMessage('Выберите накладную или весы');
 const index=Number($('caPlace').value);s.target=s.draft.places[index];s.targetIndex=index;caInvalidate();let timer;
 try{
   const body={...(s.useWaybill?{waybillImage:caCrop(s,'waybill')} :{}),...(s.useScale?{scaleImage:caCrop(s,'scale')}:{})};
   caBusy(true);if(body.waybillImage)body.waybillDetails=await caDetails(body.waybillImage);if(!caCurrent(s))return;caMessage('DeepSeek читает снимок и увеличенные фрагменты…');s.abort=new AbortController();timer=setTimeout(()=>s.abort.abort(),50000);
   const r=await fetch('/api/manager/correspondence/camera/recognize',{method:'POST',credentials:'include',cache:'no-store',redirect:'error',signal:s.abort.signal,headers:{Authorization:'Bearer '+s.token,'Content-Type':'application/json'},body:JSON.stringify(body)});
   if(!caCurrent(s))return;if(r.status===401||r.status===403){closeModal();liveEpoch++;liveClear();liveAuthRequired=true;render();return}
   let data;try{data=await r.json()}catch{throw new Error('Сервер не вернул результат. Проверьте соединение или уменьшите снимок')}
   if(!r.ok)throw new Error(data?.error?.message||'Ошибка распознавания: HTTP '+r.status);if(!caCurrent(s))return;s.result=data;caReview();caMessage('Распознано. Сверьте поля со снимком перед переносом.');
 }catch(e){if(caCurrent(s))caMessage(e.name==='AbortError'?'Распознавание прервано по времени. Повторите вручную.':e.message||'Ошибка соединения')}
 finally{clearTimeout(timer);if(caCurrent(s)){s.abort=null;caBusy(false)}}
}
function caReview(){const s=ca,r=s.result,d=s.draft;const rows=Object.entries(caFields).filter(([k])=>r.fields[k]!=null).map(([k,label])=>{
 const old=k==='recipientCity'?d.cityInput:k==='recipientRegion'?'':d[k];
 return `<div class="ca-row"><input type="checkbox" id="caUse_${k}" aria-label="Перенести: ${esc(label)}" ><label>${esc(label)}${k==='payer'?'<select id="caValue_payer">'+opt('sender','Отправитель',r.fields[k])+opt('recipient','Получатель',r.fields[k])+'</select>':`<input id="caValue_${k}" value="${esc(r.fields[k])}">`}${old?'<span class="sub">В форме: '+esc(old)+'</span>':''}</label></div>`;
 }).join('');
 $('caReview').innerHTML=`<h3>Проверьте результат</h3>${r.observations?.length?'<details><summary>Какой текст прочитал ИИ</summary><p class="sub">Это ответ модели, а не независимая проверка.</p>'+r.observations.map(o=>'<p>'+esc(o.label)+': <strong>'+esc(o.text)+'</strong></p>').join('')+'</details>':''}<p class="sub">ИИ может ошибаться. Все поля изначально выключены: сверьте со снимком и отметьте нужные. Ошибки можно исправить здесь.</p>${r.warnings?.length?'<div class="note">'+r.warnings.map(esc).join('<br>')+'</div>':''}${rows||'<p>Поля накладной не прочитаны.</p>'}${r.placesCount?`<label class="ca-check"><input id="caUseCount" type="checkbox">Количество мест: ${r.placesCount} (сейчас ${d.places.length})</label><p class="sub">При необходимости добавятся пустые места. Существующие места не удаляются.</p>`:''}${r.dimensions?.some(Boolean)?`<label class="ca-check"><input id="caUseDims" type="checkbox">Перенести написанные размеры мест</label><p class="sub">${r.dimensions.map((p,i)=>p?'Место '+(i+1)+': '+esc(p.lengthCm)+' × '+esc(p.widthCm)+' × '+esc(p.heightCm)+' см':'Место '+(i+1)+': не прочитано').join('<br>')}. Заполненные размеры не заменяются.</p>`:''}${r.scaleWeightKg?`<div class="ca-row"><input id="caUseWeight" type="checkbox" aria-label="Перенести показание весов"><label>Дисплей весов → место ${s.targetIndex+1}, кг<input id="caWeight" type="number" min="0.001" step="0.001" value="${esc(r.scaleWeightKg)}"><span class="sub">Сейчас: ${esc(s.target.measuredWeight||'не указан')}. Проверьте единицу и десятичную точку.</span></label></div>`:''}<label class="ca-check"><input id="caConfirmed" type="checkbox">Я сверил выбранные данные со снимком</label><button class="primary" onclick="caApply()">Перенести выбранное в форму</button><p class="sub">Вес накладной не подставляется в измеренный вес. Вес каждого места внесите вручную или считайте с дисплея.</p>`;
}
function caNorm(s){return String(s||'').trim().toLowerCase().replace(/ё/g,'е').replace(/^(г\.?|с\.?|п\.?|пос\.?|город|село|поселок)\s+/,'').replace(/\s+/g,' ')}
function caApply(){const s=ca;if(!s||s.busy||!s.result)return;if(!caCurrent(s)){closeModal();return toast('Черновик или сеанс изменился. Снимите новый кадр.')}
 if(!$('caConfirmed')?.checked)return caMessage('Подтвердите проверку выбранных полей');
 const r=s.result,d=s.draft,patch={};for(const k of Object.keys(caFields))if($('caUse_'+k)?.checked)patch[k]=$('caValue_'+k).value.trim();
 if(patch.payer&&!['sender','recipient'].includes(patch.payer))return caMessage('Выберите плательщика: отправитель или получатель');
 let measured=null;if($('caUseWeight')?.checked){const v=$('caWeight').value.replace(',','.');if(!/^\d+(\.\d{1,3})?$/.test(v)||Number(v)<=0||Number(v)>1000000)return caMessage('Проверьте показание весов');if(!d.places.includes(s.target))return caMessage('Список мест изменился. Снимите новый кадр.');measured=v}
 let cityMessage='';if(patch.recipientCity){const candidates=(liveData.cities||[]).filter(c=>c.isActive!==false&&[c.name,...(c.aliases||[])].some(n=>caNorm(n)===caNorm(patch.recipientCity)));const byRegion=patch.recipientRegion?candidates.filter(c=>caNorm(c.region)===caNorm(patch.recipientRegion)):[];const chosen=byRegion.length===1?byRegion[0]:candidates.length===1?candidates[0]:null;if(chosen){d.cityInput=wfCityLabel(chosen);d.destinationCityId=chosen.id}else{d.cityInput=patch.recipientCity;d.destinationCityId=null;cityMessage=' Населённый пункт выберите из справочника.'}}
 delete patch.recipientCity;delete patch.recipientRegion;Object.assign(d,patch);
 if($('caUseCount')?.checked)while(d.places.length<r.placesCount)d.places.push(wfBlankPlace());
 if($('caUseDims')?.checked)r.dimensions.forEach((p,i)=>{if(p&&d.places[i]&&!['lengthCm','widthCm','heightCm'].some(k=>d.places[i][k]))Object.assign(d.places[i],p)});
 if(measured!==null)s.target.measuredWeight=measured;
 closeModal();wfModal=false;render();toast('Данные перенесены в черновик.'+cityMessage);if(cityMessage)wfError(cityMessage.trim());
}
const caBaseClose=closeModal;closeModal=function(){caDispose();caBaseClose()};
const caBaseGo=liveGo;liveGo=function(id){if(ca)closeModal();caBaseGo(id)};
const caBaseClear=liveClear;liveClear=function(){caDispose();caBaseClear()};
$('modal').addEventListener('close',()=>{if(ca&&!$('modal').open)caDispose()});
window.addEventListener('pagehide',caDispose);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&ca)closeModal()});

window.addEventListener('storage',e=>{if((e.key==='managerToken'||e.key===null)&&liveMode){liveEpoch++;liveBusy=false;liveClear();closeModal();loadLive()}});
window.addEventListener('focus',()=>{if(liveMode)loadLive()});
if(liveOrigin()&&location.pathname.startsWith('/correspondence-test')){liveMode=true;render();loadLive()}else render();
liveTimer=setInterval(()=>{if(liveMode&&!document.hidden)loadLive()},60000);

</script></body></html>
